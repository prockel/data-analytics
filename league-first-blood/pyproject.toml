[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "league-first-blood"
version = "1.0.0"
description = "Reproducible Riot API first-blood association study"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "python-dotenv>=1,<2", "pandas>=2.2,<4", "numpy>=2,<3", "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
firstblood = "firstblood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
